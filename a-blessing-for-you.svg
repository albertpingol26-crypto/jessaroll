<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>A blessing for Ate Sweet and Kuya Rolly</title><rect width="1080" height="1350" fill="#fff9fc"/><rect x="55" y="55" width="970" height="1240" rx="22" fill="#fff" stroke="#e7c9d9" stroke-width="2"/><rect x="78" y="78" width="924" height="1194" rx="12" fill="none" stroke="#d2b17c"/><g text-anchor="middle"><text x="540" y="200" font-family="Georgia,serif" font-size="30" fill="#b78b4f">✧</text><text x="540" y="280" font-family="Arial,sans-serif" font-size="16" letter-spacing="5" fill="#a33374">A LITTLE BLESSING, WITH LOVE</text><text x="540" y="400" font-family="Georgia,serif" font-size="68" fill="#bc2477">Ate Sweet</text><text x="540" y="475" font-family="Georgia,serif" font-size="52" fill="#262026">and Kuya Rolly</text><text x="540" y="610" font-family="Georgia,serif" font-size="38" fill="#49323f">May God’s love bring warmth</text><text x="540" y="675" font-family="Georgia,serif" font-size="38" fill="#49323f">to your hearts,</text><text x="540" y="740" font-family="Georgia,serif" font-size="38" fill="#49323f">peace to your home,</text><text x="540" y="805" font-family="Georgia,serif" font-size="38" fill="#49323f">and little reasons to smile</text><text x="540" y="870" font-family="Georgia,serif" font-size="38" fill="#49323f">each day.</text><text x="540" y="1020" font-family="Georgia,serif" font-style="italic" font-size="31" fill="#b32978">You are loved. Just as you are.</text><text x="540" y="1150" font-family="Arial,sans-serif" font-size="15" letter-spacing="3" fill="#88627b">HELD IN LOVE ♡</text></g></svg>
